<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Arcade - Complete Game Collection</title>
  <style>
    :root {
      --bg-1: #050816;
      --bg-2: #0d1020;
      --bg-3: #171d32;
      --panel: rgba(13, 17, 29, 0.78);
      --panel-strong: rgba(10, 14, 24, 0.9);
      --line: rgba(255, 255, 255, 0.08);
      --cyan: #69f1ff;
      --cyan-2: #3ad7ff;
      --blue: #59a7ff;
      --pink: #ff6ae8;
      --purple: #ad7cff;
      --gold: #ffd166;
      --green: #4af7b5;
      --red: #ff5d73;
      --text: #edf6ff;
      --muted: #9bb4d2;
      --shadow-cyan: rgba(105, 241, 255, 0.5);
      --shadow-pink: rgba(255, 106, 232, 0.4);
      --shadow-gold: rgba(255, 209, 102, 0.4);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(105, 241, 255, 0.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255, 106, 232, 0.12), transparent 34%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
      color: var(--text);
      overflow: hidden;
    }

    body { display: grid; place-items: center; }

    .launcher-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 40px;
      overflow-y: auto;
      z-index: 10;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.4s ease, pointer-events 0.4s ease;
    }

    .launcher-screen.hidden { opacity: 0; pointer-events: none; }

    .launcher-header { text-align: center; animation: slideInDown 0.6s ease-out; }

    .launcher-logo {
      display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px;
    }

    .launcher-logo svg {
      width: 56px; height: 56px; filter: drop-shadow(0 0 20px rgba(105,241,255,0.8)); animation: float 3s ease-in-out infinite;
    }

    .launcher-title {
      font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--cyan), var(--pink), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin: 0; text-transform: uppercase; text-shadow: 0 0 40px rgba(105,241,255,0.3);
    }

    .launcher-subtitle { font-size: 1.1rem; color: var(--muted); letter-spacing: 0.05em; margin-top: 12px; }

    .games-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; max-width: 1400px; width: 100%;
      animation: slideInUp 0.8s ease-out 0.2s both;
    }

    .game-card {
      position: relative; background: linear-gradient(135deg, rgba(105,241,255,0.05), rgba(255,106,232,0.03));
      border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; cursor: pointer; overflow: hidden;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .game-card::before {
      content: ''; position: absolute; inset: 0; background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.05), transparent 70%);
      opacity: 0; transition: opacity 0.4s ease;
    }

    .game-card:hover {
      transform: translateY(-12px); border-color: rgba(105,241,255,0.4);
      background: linear-gradient(135deg, rgba(105,241,255,0.1), rgba(255,106,232,0.08));
      box-shadow: 0 20px 60px rgba(105,241,255,0.2), 0 0 40px rgba(255,106,232,0.15);
    }

    .game-card:hover::before { opacity: 1; }

    .game-icon { font-size: 3.5rem; margin-bottom: 16px; filter: drop-shadow(0 0 12px rgba(105,241,255,0.4)); }

    .game-title { font-size: 1.5rem; font-weight: 800; color: var(--cyan); margin: 0 0 8px; letter-spacing: 0.05em; }
    .game-description { font-size: 0.95rem; color: var(--muted); line-height: 1.5; margin: 0 0 16px; }

    .game-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .game-tag {
      font-size: 0.75rem; padding: 6px 12px; border-radius: 999px; background: rgba(105,241,255,0.1);
      border: 1px solid rgba(105,241,255,0.3); color: var(--cyan); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    }

    .game-play-btn {
      width: 100%; padding: 14px 20px; border: none; border-radius: 12px; background: linear-gradient(90deg, var(--cyan), var(--pink));
      color: #000; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
      box-shadow: 0 10px 30px rgba(105,241,255,0.3); transition: all 0.3s ease;
    }

    .game-play-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(105,241,255,0.5); }
    .game-play-btn:active { transform: scale(0.98); }

    .launcher-footer { text-align: center; font-size: 0.9rem; color: var(--muted); letter-spacing: 0.05em; }

    .game-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column; z-index: 100;
      background: linear-gradient(180deg, rgba(5,8,18,0.95), rgba(9,12,21,0.98)); opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .game-screen.active { opacity: 1; pointer-events: auto; }

    .game-screen-header {
      background: linear-gradient(90deg, rgba(105,241,255,0.1), rgba(255,106,232,0.1)); border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }

    .game-screen-title { font-size: 1.3rem; font-weight: 800; color: var(--cyan); margin: 0; letter-spacing: 0.05em; }

    .back-btn {
      background: rgba(255,106,232,0.2); border: 1px solid rgba(255,106,232,0.4); color: var(--pink); padding: 10px 18px; border-radius: 10px;
      cursor: pointer; font-weight: 700; transition: all 0.3s ease;
    }
    .back-btn:hover { background: rgba(255,106,232,0.3); box-shadow: 0 0 15px rgba(255,106,232,0.3); }

    .game-screen-content { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

    canvas { display: block; width: 100%; height: 100%; }

    .cyber-container {
      display: flex; gap: 20px; padding: 20px; width: 100%; height: 100%; align-items: flex-start; justify-content: center;
    }

    .cyber-board {
      position: relative; width: 900px; height: 600px; border-radius: 14px; border: 1px solid rgba(105,241,255,0.3);
      background: linear-gradient(180deg, rgba(2,2,6,0.8), rgba(6,6,12,1)); box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 30px rgba(105,241,255,0.05);
      overflow: hidden;
    }

    .cyber-sidebar {
      width: 280px; background: linear-gradient(180deg, rgba(20,25,40,0.8), rgba(15,18,32,0.95)); border: 1px solid rgba(105,241,255,0.2);
      border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: 600px; overflow-y: auto;
    }

    .cyber-stat {
      background: rgba(105,241,255,0.1); border: 1px solid rgba(105,241,255,0.2); padding: 12px; border-radius: 10px; text-align: center;
    }

    .cyber-stat-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .cyber-stat-value { font-size: 1.8rem; font-weight: 900; color: var(--gold); }

    .frame {
      position: relative; width: 90%; max-width: 1000px; border-radius: 16px; overflow: hidden; box-shadow: 0 0 40px rgba(57,208,255,0.2);
      background: linear-gradient(180deg, rgba(10,6,14,0.7), rgba(7,3,10,0.9)); border: 2px solid rgba(57,208,255,0.3);
    }

    @keyframes slideInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

    @media (max-width: 1200px) {
      .games-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); padding: 0 20px; }
      .cyber-container { flex-direction: column; align-items: center; }
      .cyber-sidebar { width: 100%; max-height: none; }
    }

    @media (max-width: 768px) {
      .launcher-title { font-size: 2.5rem; }
      .launcher-subtitle { font-size: 1rem; }
      .games-grid { grid-template-columns: 1fr; gap: 20px; padding: 0 16px; }
      .game-card { padding: 20px; }
      .game-screen-header { padding: 14px 16px; }
    }
    @media (max-width: 480px) {
      .launcher-screen { padding: 20px 12px; gap: 24px; }
      .launcher-logo { gap: 8px; }
      .launcher-logo svg { width: 40px; height: 40px; }
      .launcher-title { font-size: 1.8rem; }
      .game-card { padding: 16px; }
      .game-title { font-size: 1.2rem; }
      .game-description { font-size: 0.9rem; }
      .game-play-btn { padding: 12px 16px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="launcher-screen" id="launcherScreen">
    <div class="launcher-header">
      <div class="launcher-logo">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="20" height="20" rx="3" stroke="url(#grad1)" stroke-width="1.5" fill="none" />
          <circle cx="7" cy="7" r="1.5" fill="url(#grad1)" />
          <circle cx="12" cy="7" r="1.5" fill="url(#grad1)" />
          <path d="M7 12h10M7 16h6" stroke="url(#grad1)" stroke-width="1.5" stroke-linecap="round" />
          <defs>
            <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#69f1ff" />
              <stop offset="100%" stop-color="#ff6ae8" />
            </linearGradient>
          </defs>
        </svg>
        <h1 class="launcher-title">NEON ARCADE</h1>
      </div>
      <p class="launcher-subtitle">Select a game and dive in</p>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
    <div class="launcher-footer">🎮 Built with passion • All games run instantly • Pure JavaScript • No external dependencies</div>
  </div>

  <!-- Game Screens -->
  <div class="game-screen" id="cyberCircuitScreen">
    <div class="game-screen-header">
      <h2 class="game-screen-title">🎮 Cyber Circuit - Tower Defense</h2>
      <button class="back-btn" onclick="backToLauncher()">← BACK</button>
    </div>
    <div class="game-screen-content">
      <div class="cyber-container">
        <div class="cyber-board"><canvas id="cyberCanvas" width="900" height="600"></canvas></div>
        <div class="cyber-sidebar">
          <div class="cyber-stat"><div class="cyber-stat-label">Credits</div><div class="cyber-stat-value" id="cyberCredits">100</div></div>
          <div class="cyber-stat"><div class="cyber-stat-label">Wave</div><div class="cyber-stat-value" id="cyberWave">1</div></div>
          <div class="cyber-stat"><div class="cyber-stat-label">Health</div><div class="cyber-stat-value" id="cyberHealth">20</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="game-screen" id="neonDodgeScreen">
    <div class="game-screen-header">
      <h2 class="game-screen-title">⚡ Neon Dodge</h2>
      <button class="back-btn" onclick="backToLauncher()">← BACK</button>
    </div>
    <div class="game-screen-content">
      <div class="frame"><canvas id="neonCanvas" width="1000" height="600"></canvas></div>
    </div>
  </div>

  <div class="game-screen" id="tagScreen">
    <div class="game-screen-header">
      <h2 class="game-screen-title">🏃 Tag - Survival</h2>
      <button class="back-btn" onclick="backToLauncher()">← BACK</button>
    </div>
    <div class="game-screen-content">
      <div class="frame"><canvas id="tagCanvas" width="900" height="700"></canvas></div>
    </div>
  </div>

  <div class="game-screen" id="pongScreen">
    <div class="game-screen-header">
      <h2 class="game-screen-title">🎯 Pong</h2>
      <button class="back-btn" onclick="backToLauncher()">← BACK</button>
    </div>
    <div class="game-screen-content">
      <div class="frame"><canvas id="pongCanvas" width="1000" height="600"></canvas></div>
    </div>
  </div>

  <div class="game-screen" id="retroScreen">
    <div class="game-screen-header">
      <h2 class="game-screen-title">🕹️ Retro Scavenger</h2>
      <button class="back-btn" onclick="backToLauncher()">← BACK</button>
    </div>
    <div class="game-screen-content">
      <div class="frame"><canvas id="retroCanvas" width="1000" height="700"></canvas></div>
    </div>
  </div>

  <div class="game-screen" id="asteroidScreen">
    <div class="game-screen-header">
      <h2 class="game-screen-title">💥 Asteroid Blaster</h2>
      <button class="back-btn" onclick="backToLauncher()">← BACK</button>
    </div>
    <div class="game-screen-content">
      <div class="frame"><canvas id="asteroidCanvas" width="1000" height="700"></canvas></div>
    </div>
  </div>

  <script>
    const gamesData = [
      { id: 'cyber-circuit', name: 'Cyber Circuit', icon: '🎮', description: 'Build towers and defend your circuit from waves of digital enemies', tags: ['Strategy','Tower Defense','Real-time'] },
      { id: 'neon-dodge', name: 'Neon Dodge', icon: '⚡', description: 'Navigate lanes and avoid incoming obstacles with perfect timing', tags: ['Arcade','Dodge','Reflex'] },
      { id: 'tag', name: 'Tag', icon: '🏃', description: 'Survive against a relentless AI chaser with increasing speed', tags: ['Survival','AI Battle','Endurance'] },
      { id: 'pong', name: 'Pong', icon: '🎯', description: 'Classic paddle-based arcade action against adaptive AI opponent', tags: ['Classic','Arcade','Action'] },
      { id: 'retro-scavenger', name: 'Retro Scavenger', icon: '🕹️', description: 'Top-down collection game: gather orbs and avoid hazards', tags: ['Collector','Arcade','Retro'] },
      { id: 'asteroid', name: 'Asteroid Blaster', icon: '💥', description: 'Shoot asteroids and survive waves of space debris', tags: ['Shooter','Space','Action'] }
    ];

    const keysPressed = {};

    window.addEventListener('keydown', (e) => {
      keysPressed[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
      keysPressed[e.key.toLowerCase()] = false;
    });

    function initLauncher() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = gamesData.map(game => `
        <div class="game-card" onclick="startGame('${game.id}')">
          <div class="game-icon">${game.icon}</div>
          <h3 class="game-title">${game.name}</h3>
          <p class="game-description">${game.description}</p>
          <div class="game-tags">${game.tags.map(tag => `<span class="game-tag">${tag}</span>`).join('')}</div>
          <button class="game-play-btn" onclick="event.stopPropagation(); startGame('${game.id}')">PLAY NOW</button>
        </div>
      `).join('');
    }

    function startGame(gameId) {
      document.getElementById('launcherScreen').classList.add('hidden');
      document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));

      switch(gameId) {
        case 'cyber-circuit':
          document.getElementById('cyberCircuitScreen').classList.add('active');
          initCyberCircuit();
          break;
        case 'neon-dodge':
          document.getElementById('neonDodgeScreen').classList.add('active');
          initNeonDodge();
          break;
        case 'tag':
          document.getElementById('tagScreen').classList.add('active');
          initTag();
          break;
        case 'pong':
          document.getElementById('pongScreen').classList.add('active');
          initPong();
          break;
        case 'retro-scavenger':
          document.getElementById('retroScreen').classList.add('active');
          initRetroScavenger();
          break;
        case 'asteroid':
          document.getElementById('asteroidScreen').classList.add('active');
          initAsteroidBlaster();
          break;
      }
    }

    function backToLauncher() {
      document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));
      document.getElementById('launcherScreen').classList.remove('hidden');
    }

    // ===== CYBER CIRCUIT =====
    let cyberRAF = null;
    function initCyberCircuit() {
      const canvas = document.getElementById('cyberCanvas');
      const ctx = canvas.getContext('2d');
      const creditsEl = document.getElementById('cyberCredits');
      const waveEl = document.getElementById('cyberWave');
      const healthEl = document.getElementById('cyberHealth');
      const gridSize = 30;
      const cols = Math.floor(canvas.width / gridSize);
      const rows = Math.floor(canvas.height / gridSize);

      if (cyberRAF) cancelAnimationFrame(cyberRAF);

      let gameState = { credits: 100, health: 20, wave: 1, towers: [], enemies: [], timer: 0, running: true };

      function drawGrid() {
        ctx.strokeStyle = 'rgba(105,241,255,0.1)'; ctx.lineWidth = 1;
        for (let x = 0; x <= cols; x++) { ctx.beginPath(); ctx.moveTo(x * gridSize, 0); ctx.lineTo(x * gridSize, canvas.height); ctx.stroke(); }
        for (let y = 0; y <= rows; y++) { ctx.beginPath(); ctx.moveTo(0, y * gridSize); ctx.lineTo(canvas.width, y * gridSize); ctx.stroke(); }
      }

      function drawTowers() {
        for (const tower of gameState.towers) {
          ctx.fillStyle = '#69f1ff';
          ctx.fillRect(tower.x, tower.y, gridSize - 2, gridSize - 2);
          ctx.fillStyle = 'rgba(105,241,255,0.3)';
          ctx.beginPath(); ctx.arc(tower.x + gridSize / 2, tower.y + gridSize / 2, 80, 0, Math.PI * 2); ctx.fill();
        }
      }

      function drawEnemies() {
        for (const enemy of gameState.enemies) {
          ctx.fillStyle = '#ff5d73';
          ctx.fillRect(enemy.x, enemy.y, 16, 16);
        }
      }

      function spawnEnemy() {
        const side = Math.floor(Math.random() * 4);
        let x = 0, y = 0;
        if(side === 0){ x = Math.random()*canvas.width; y = -20; }
        else if(side === 1){ x = canvas.width + 20; y = Math.random()*canvas.height; }
        else if(side === 2){ x = Math.random()*canvas.width; y = canvas.height + 20; }
        else { x = -20; y = Math.random()*canvas.height; }
        gameState.enemies.push({ x, y, health: 8 + gameState.wave * 2 });
      }

      function update() {
        gameState.timer++;
        if (gameState.timer > 140) { gameState.wave++; gameState.timer = 0; for (let i = 0; i < Math.min(2 + gameState.wave, 10); i++) spawnEnemy(); }
        for (const enemy of gameState.enemies) {
          enemy.x += enemy.health > 10 ? 0.6 : 0.9;
          enemy.y += 0.4;
          if (enemy.x > canvas.width || enemy.y > canvas.height) {
            gameState.health = Math.max(0, gameState.health - 1);
            if (gameState.health <= 0) gameState.running = false;
          }
        }
        creditsEl.textContent = gameState.credits;
        waveEl.textContent = gameState.wave;
        healthEl.textContent = gameState.health;
      }

      function render() {
        ctx.fillStyle = '#050816'; ctx.fillRect(0,0,canvas.width,canvas.height);
        drawGrid(); drawTowers(); drawEnemies();
        if (gameState.running) { update(); cyberRAF = requestAnimationFrame(render); }
      }

      canvas.onclick = function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / gridSize) * gridSize;
        const y = Math.floor((e.clientY - rect.top) / gridSize) * gridSize;
        if (gameState.credits >= 30) {
          gameState.towers.push({ x, y });
          gameState.credits -= 30;
        }
      };

      render();
    }

    // ===== NEON DODGE =====
    let neonRAF = null;
    function initNeonDodge() {
      const canvas = document.getElementById('neonCanvas');
      const ctx = canvas.getContext('2d');

      if (neonRAF) cancelAnimationFrame(neonRAF);

      let lane = 1;
      let score = 0;
      let obstacles = [];
      let lastSpawn = 0;

      function draw() {
        ctx.fillStyle = '#07030a'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = 'rgba(57,208,255,0.2)'; ctx.lineWidth = 2;
        for (let i = 1; i < 3; i++) {
          ctx.beginPath(); ctx.moveTo(i * (canvas.width / 3), 0); ctx.lineTo(i * (canvas.width / 3), canvas.height); ctx.stroke();
        }
        const playerX = lane * (canvas.width / 3) + (canvas.width / 6) - 15;
        ctx.fillStyle = '#69f1ff'; ctx.fillRect(playerX, canvas.height - 50, 30, 30);
        ctx.fillStyle = '#39d0ff';
        for (const obs of obstacles) { ctx.fillRect(obs.x, obs.y, 20, 20); }
        ctx.fillStyle = '#39d0ff'; ctx.font = 'bold 20px Inter'; ctx.fillText('Score: ' + score, 20, 30);
      }

      function update() {
        score++;
        if (performance.now() - lastSpawn > 800) {
          const laneIndex = Math.floor(Math.random() * 3);
          obstacles.push({ x: laneIndex * (canvas.width / 3) + (canvas.width / 6) - 10, y: -20 });
          lastSpawn = performance.now();
        }

        if (keysPressed['arrowleft'] || keysPressed['a']) {
          lane = Math.max(0, lane - 0.15);
        }
        if (keysPressed['arrowright'] || keysPressed['d']) {
          lane = Math.min(2, lane + 0.15);
        }

        const playerX = lane * (canvas.width / 3) + (canvas.width / 6) - 15;
        for (let i = obstacles.length - 1; i >= 0; i--) {
          obstacles[i].y += 8;
          if (obstacles[i].y > canvas.height) obstacles.splice(i, 1);
          if (Math.abs(obstacles[i].x - playerX) < 20 && Math.abs(obstacles[i].y - (canvas.height - 35)) < 30) {
            lane = 1; score = 0; obstacles = [];
          }
        }
      }

      function loop() {
        draw();
        update();
        neonRAF = requestAnimationFrame(loop);
      }

      loop();
    }

    // ===== TAG =====
    let tagRAF = null;
    function initTag() {
      const canvas = document.getElementById('tagCanvas');
      const ctx = canvas.getContext('2d');

      if (tagRAF) cancelAnimationFrame(tagRAF);

      let player = { x: 100, y: 100, r: 16, vx: 0, vy: 0 };
      let chaser = { x: canvas.width - 100, y: canvas.height - 100, r: 16 };
      let score = 0;
      let running = true;
      const playerSpeed = 6;

      function draw() {
        ctx.fillStyle = '#0b0b12'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#2ea8ff'; ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff5d73'; ctx.beginPath(); ctx.arc(chaser.x, chaser.y, chaser.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#2ea8ff'; ctx.font = 'bold 20px Inter'; ctx.fillText('Time: ' + Math.floor(score / 60) + 's', 20, 30);
      }

      function update() {
        if (!running) return;

        score++;

        player.vx = 0;
        player.vy = 0;

        if (keysPressed['arrowup'] || keysPressed['w']) player.vy -= playerSpeed;
        if (keysPressed['arrowdown'] || keysPressed['s']) player.vy += playerSpeed;
        if (keysPressed['arrowleft'] || keysPressed['a']) player.vx -= playerSpeed;
        if (keysPressed['arrowright'] || keysPressed['d']) player.vx += playerSpeed;

        player.x += player.vx;
        player.y += player.vy;
        player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
        player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

        const dx = player.x - chaser.x;
        const dy = player.y - chaser.y;
        const dist = Math.hypot(dx, dy) || 1;
        chaser.x += (dx / dist) * 2.8;
        chaser.y += (dy / dist) * 2.8;

        if (Math.hypot(player.x - chaser.x, player.y - chaser.y) < player.r + chaser.r) running = false;
      }

      function loop() {
        draw();
        update();
        if (running) {
          tagRAF = requestAnimationFrame(loop);
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle = '#ff5d73';
          ctx.font='bold 40px Inter';
          ctx.textAlign='center';
          ctx.fillText('CAUGHT!', canvas.width/2, canvas.height/2 - 20);
        }
      }

      loop();
    }

    // ===== PONG =====
    let pongRAF = null;
    function initPong() {
      const canvas = document.getElementById('pongCanvas');
      const ctx = canvas.getContext('2d');

      if (pongRAF) cancelAnimationFrame(pongRAF);

      const player = { x: 20, y: canvas.height/2 - 50, width: 10, height: 100, vy: 0 };
      const ai = { x: canvas.width - 30, y: canvas.height/2 - 50, width: 10, height: 100 };
      const ball = { x: canvas.width/2, y: canvas.height/2, r: 8, vx: 5, vy: 5 };
      let pScore = 0, aiScore = 0;
      const playerSpeed = 7;

      function draw() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#00ff00'; ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = '#ff0000'; ctx.fillRect(ai.x, ai.y, ai.width, ai.height);
        ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font='bold 24px Courier'; ctx.textAlign='center'; ctx.fillText(`${pScore} : ${aiScore}`, canvas.width/2, 40);
      }

      function update() {
        player.vy = 0;
        if (keysPressed['arrowup'] || keysPressed['w']) player.vy = -playerSpeed;
        if (keysPressed['arrowdown'] || keysPressed['s']) player.vy = playerSpeed;

        player.y += player.vy;
        player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

        ball.x += ball.vx;
        ball.y += ball.vy;
        if (ball.y < ball.r || ball.y > canvas.height - ball.r) ball.vy *= -1;
        if (ball.x - ball.r < player.x + player.width && ball.y > player.y && ball.y < player.y + player.height) ball.vx = Math.abs(ball.vx) + 1;
        if (ball.x + ball.r > ai.x && ball.y > ai.y && ball.y < ai.y + ai.height) ball.vx = -Math.abs(ball.vx) - 1;
        if (ball.x < 0) { aiScore++; ball.x = canvas.width/2; ball.y = canvas.height/2; }
        if (ball.x > canvas.width) { pScore++; ball.x = canvas.width/2; ball.y = canvas.height/2; }
        const aiCenter = ai.y + ai.height / 2;
        if (aiCenter < ball.y) ai.y += 4; else ai.y -= 4;
        ai.y = Math.max(0, Math.min(canvas.height - ai.height, ai.y));
      }

      function loop() {
        draw();
        update();
        pongRAF = requestAnimationFrame(loop);
      }

      loop();
    }

    // ===== RETRO SCAVENGER =====
    let retroRAF = null;
    function initRetroScavenger() {
      const canvas = document.getElementById('retroCanvas');
      const ctx = canvas.getContext('2d');

      if (retroRAF) cancelAnimationFrame(retroRAF);

      let player = { x: canvas.width/2, y: canvas.height/2, r: 12, vx: 0, vy: 0 };
      let collectibles = [];
      let hazards = [];
      let score = 0;
      let lives = 3;
      const playerSpeed = 6;

      for (let i = 0; i < 5; i++) {
        collectibles.push({ x: Math.random() * (canvas.width - 20) + 10, y: Math.random() * (canvas.height - 20) + 10, r: 8 });
      }
      for (let i = 0; i < 2; i++) {
        hazards.push({ x: Math.random() * (canvas.width - 20) + 10, y: Math.random() * (canvas.height - 20) + 10, size: 12, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3 });
      }

      function draw() {
        ctx.fillStyle = '#00121a'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#39ff14'; ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffde59'; for (const c of collectibles) { ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = '#ff5f5f'; for (const h of hazards) { ctx.fillRect(h.x - h.size/2, h.y - h.size/2, h.size, h.size); }
        ctx.fillStyle = '#9fe7c9'; ctx.font='bold 16px monospace'; ctx.textAlign='left'; ctx.fillText('SCORE: ' + score, 10, 20);
        ctx.textAlign='right'; ctx.fillStyle='#ff9f9f'; ctx.fillText('LIVES: ' + lives, canvas.width - 10, 20);
      }

      function update() {
        player.vx = 0;
        player.vy = 0;

        if (keysPressed['arrowup'] || keysPressed['w']) player.vy -= playerSpeed;
        if (keysPressed['arrowdown'] || keysPressed['s']) player.vy += playerSpeed;
        if (keysPressed['arrowleft'] || keysPressed['a']) player.vx -= playerSpeed;
        if (keysPressed['arrowright'] || keysPressed['d']) player.vx += playerSpeed;

        player.x += player.vx;
        player.y += player.vy;
        player.x = Math.max(0, Math.min(canvas.width, player.x));
        player.y = Math.max(0, Math.min(canvas.height, player.y));

        for (let i = collectibles.length - 1; i >= 0; i--) {
          const c = collectibles[i];
          if (Math.hypot(player.x - c.x, player.y - c.y) < player.r + c.r) { collectibles.splice(i,1); score += 10; if (collectibles.length < 3) collectibles.push({ x: Math.random() * (canvas.width - 20) + 10, y: Math.random() * (canvas.height - 20) + 10, r: 8 }); }
        }

        for (const h of hazards) {
          h.x += h.vx; h.y += h.vy; if (h.x < 0 || h.x > canvas.width) h.vx *= -1; if (h.y < 0 || h.y > canvas.height) h.vy *= -1;
          if (Math.hypot(player.x - h.x, player.y - h.y) < player.r + h.size) { lives--; player.x = canvas.width/2; player.y = canvas.height/2; }
        }
      }

      function loop() {
        draw();
        update();
        retroRAF = requestAnimationFrame(loop);
      }

      loop();
    }

    // ===== ASTEROID BLASTER =====
    let asteroidRAF = null;
    function initAsteroidBlaster() {
      const canvas = document.getElementById('asteroidCanvas');
      const ctx = canvas.getContext('2d');

      if (asteroidRAF) cancelAnimationFrame(asteroidRAF);

      let ship = { x: canvas.width / 2, y: canvas.height - 50, angle: 0, r: 15, angularVelocity: 0 };
      let bullets = [];
      let asteroids = [];
      let score = 0;
      let health = 100;
      let running = true;
      const rotationSpeed = 0.15;

      function spawnAsteroids(count = 3) {
        for (let i = 0; i < count; i++) {
          asteroids.push({
            x: Math.random() * canvas.width,
            y: Math.random() * (canvas.height / 2),
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4 + 1,
            size: 20 + Math.random() * 20
          });
        }
      }

      spawnAsteroids();

      function drawShip() {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        ctx.fillStyle = '#00ff00';
        ctx.beginPath();
        ctx.moveTo(0, -ship.r);
        ctx.lineTo(ship.r, ship.r);
        ctx.lineTo(-ship.r, ship.r);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        ctx.fillStyle = '#0a0a14'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawShip();

        ctx.fillStyle = '#ffff00';
        for (const bullet of bullets) {
          ctx.fillRect(bullet.x, bullet.y, 4, 10);
        }

        ctx.fillStyle = '#ff8800';
        for (const ast of asteroids) {
          ctx.beginPath();
          ctx.arc(ast.x, ast.y, ast.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#00ff00'; ctx.font = 'bold 18px monospace'; ctx.fillText('SCORE: ' + score, 10, 20);
        ctx.fillStyle = '#ff0000'; ctx.fillText('HEALTH: ' + health, 10, 50);
      }

      function update() {
        ship.angularVelocity = 0;
        if (keysPressed['arrowleft'] || keysPressed['a']) ship.angularVelocity = -rotationSpeed;
        if (keysPressed['arrowright'] || keysPressed['d']) ship.angularVelocity = rotationSpeed;

        ship.angle += ship.angularVelocity;

        if (keysPressed[' ']) {
          bullets.push({ x: ship.x, y: ship.y, vx: Math.sin(ship.angle) * 6, vy: -Math.cos(ship.angle) * 6 });
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].x += bullets[i].vx;
          bullets[i].y += bullets[i].vy;
          if (bullets[i].y < 0 || bullets[i].x < 0 || bullets[i].x > canvas.width) bullets.splice(i, 1);
        }

        for (let i = asteroids.length - 1; i >= 0; i--) {
          asteroids[i].x += asteroids[i].vx;
          asteroids[i].y += asteroids[i].vy;
          if (asteroids[i].x < 0 || asteroids[i].x > canvas.width) asteroids[i].vx *= -1;
          if (asteroids[i].y < 0 || asteroids[i].y > canvas.height) asteroids[i].vy *= -1;

          for (let j = bullets.length - 1; j >= 0; j--) {
            const dist = Math.hypot(asteroids[i].x - bullets[j].x, asteroids[i].y - bullets[j].y);
            if (dist < asteroids[i].size) {
              bullets.splice(j, 1);
              score += 10;
              asteroids.splice(i, 1);
              if (asteroids.length === 0) spawnAsteroids(Math.min(5, 3 + Math.floor(score / 100)));
              break;
            }
          }
        }

        for (const ast of asteroids) {
          const dist = Math.hypot(ship.x - ast.x, ship.y - ast.y);
          if (dist < ship.r + ast.size) {
            health -= 10;
            if (health <= 0) running = false;
          }
        }
      }

      function loop() {
        draw();
        if (running) {
          update();
          asteroidRAF = requestAnimationFrame(loop);
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ff0000';
          ctx.font = 'bold 40px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        }
      }

      loop();
    }

    window.addEventListener('DOMContentLoaded', initLauncher);
  </script>
